
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    overflow-x: hidden;
    background: transparent;
    color: #F3EEE5;
    font-family: Arial, sans-serif;
}

.gallery-heading {
    margin: 12px 0 20px;
    color: #C9A96E;
    font-size: 12px;
    letter-spacing: 4px;
    opacity: 0;
    animation: textReveal 700ms ease-out 100ms forwards;
}

.gallery {
    display: grid;
    grid-template-columns: 1fr 1.15fr 1fr;
    gap: 14px;
}

.gallery {
    min-width: 0;
}

.frame {
    min-width: 0;
}

.frame {
    position: relative;
    overflow: hidden;
    border-radius: 8px;
    aspect-ratio: 4 / 3;
    background: #19191D;
    opacity: 0;
    transform: translateY(25px) scale(0.97);
    filter: brightness(0.55);
    animation: frameReveal 900ms cubic-bezier(0.2, 0.7, 0.2, 1) forwards;
}

.frame:nth-child(1) {
    animation-delay: 250ms;
}

.frame:nth-child(2) {
    animation-delay: 650ms;
}

.frame:nth-child(3) {
    animation-delay: 1050ms;
}

.frame img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 700ms ease;
}

.frame:hover img {
    transform: scale(1.06);
}

.caption {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 25px 11px 10px;
    color: #F3EEE5;
    font-size: 10px;
    letter-spacing: 2px;
    background: linear-gradient(transparent, rgba(0, 0, 0, 0.9));
}

@keyframes textReveal {
    to {
        opacity: 1;
    }
}

@keyframes frameReveal {
    0% {
        opacity: 0;
        transform: translateY(25px) scale(0.97);
        filter: brightness(0.55);
    }
    100% {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: brightness(1);
    }
}

@media (max-width: 650px) {
    .gallery {
        grid-template-columns: 1fr;
    }

    .frame {
        aspect-ratio: 16 / 9;
    }
}


</style>
</head>

<body>
    <div class="gallery-heading">
        A FRAME. A FEELING. A STORY.
    </div>

    <div class="gallery">
        <div class="frame">
            <img
                src="https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=700&q=85"
                alt="Cinema framing">
            <div class="caption">THE ART OF FRAMING</div>
        </div>

        <div class="frame">
            <img
                src="https://images.unsplash.com/photo-1485846234645-a62644f84728?auto=format&fit=crop&w=900&q=85"
                alt="Film production">
            <div class="caption">BEHIND EVERY FRAME</div>
        </div>

        <div class="frame">
            <img
                src="https://images.unsplash.com/photo-1517604931442-7e0c8ed2963c?auto=format&fit=crop&w=700&q=85"
                alt="Cinema experience">
            <div class="caption">THE LANGUAGE OF CINEMA</div>
        </div>
    </div>
</body>
</html>
